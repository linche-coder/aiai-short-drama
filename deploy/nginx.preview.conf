# Example only: not installed or applied. Serves the project's actual static dist output.
# Put TLS in front of this loopback listener; do not expose credentials over HTTP.
server {
    listen 127.0.0.1:8080;
    server_name _;
    root /srv/aiai-preview/dist;
    index index.html;
    auth_basic "AIAI preview";
    auth_basic_user_file /etc/nginx/secrets/aiai-preview.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Basic auth protects HTML AND static assets. The file above is managed outside the repo.
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
    # No backend exists yet. Do not accidentally return SPA HTML as a successful API response.
    location /api/ { return 503; }
    location ~ /\. { deny all; }
}
